<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>You have a special wish! | WishCard.in</title>

<!-- OG Meta Tags for WhatsApp/Social Preview -->
<meta property="og:title" content="Someone made a special card for you!">
<meta property="og:description" content="Open to see your personalized greeting card with love. Made on WishCard.in">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WishCard.in">
<meta property="og:image" content="https://wishcard-in.web.app/og-preview.png">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Someone made a special card for you!">
<meta name="twitter:description" content="Open to see your personalized greeting card with love.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Outfit', sans-serif;
  background: #05020a;
  color: #fff;
}

/* Loading Screen */
.loading-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #05020a;
  z-index: 100;
  transition: opacity 0.5s ease;
}

.loading-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.spinner {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 4px solid rgba(168, 85, 247, 0.2);
  border-top-color: #a855f7;
  animation: spin 0.8s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 16px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.7);
  margin-bottom: 8px;
}

.loading-brand {
  font-size: 13px;
  font-weight: 300;
  color: rgba(168, 85, 247, 0.6);
}

/* Card Section */
.card-section {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 40;
  background: #05020a;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.card-section.active {
  display: block;
  opacity: 1;
}

.card-section iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Error Section */
.error-section {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #05020a;
  z-index: 90;
  padding: 24px;
  text-align: center;
}

.error-section.active {
  display: flex;
}

.error-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.error-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #fff;
}

.error-message {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.6);
  margin-bottom: 24px;
  max-width: 300px;
  line-height: 1.5;
}

.error-btn {
  padding: 12px 28px;
  background: rgba(168, 85, 247, 0.2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(168, 85, 247, 0.4);
  border-radius: 24px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  font-family: 'Outfit', sans-serif;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s;
}

.error-btn:hover {
  background: rgba(168, 85, 247, 0.35);
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Loading your special card...</div>
  <div class="loading-brand">WishCard.in</div>
</div>

<!-- Card Section -->
<div class="card-section" id="cardSection">
  <iframe id="cardIframe" sandbox="allow-scripts allow-same-origin" title="Your greeting card"></iframe>
</div>

<!-- Error Section -->
<div class="error-section" id="errorSection">
  <div class="error-icon">&#128542;</div>
  <div class="error-title" id="errorTitle">Oops!</div>
  <div class="error-message" id="errorMessage"></div>
  <a class="error-btn" id="errorBtn" href="https://wishcard.in">Go to WishCard.in</a>
</div>

<script type="module">
import { db } from './js/firebase-config.js';
import { doc, getDoc, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// DOM elements
const loadingScreen = document.getElementById('loadingScreen');
const cardSection = document.getElementById('cardSection');
const cardIframe = document.getElementById('cardIframe');
const errorSection = document.getElementById('errorSection');
const errorTitle = document.getElementById('errorTitle');
const errorMessage = document.getElementById('errorMessage');
const errorBtn = document.getElementById('errorBtn');

// Parse cardId from URL: /card/abc123 -> "abc123"
const pathParts = window.location.pathname.split('/');
const cardId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];

function showError(title, message, btnText, btnAction) {
  loadingScreen.classList.add('hidden');
  cardSection.classList.remove('active');
  errorSection.classList.add('active');
  errorTitle.textContent = title;
  errorMessage.textContent = message;
  if (btnText) errorBtn.textContent = btnText;
  if (btnAction === 'retry') {
    errorBtn.href = '#';
    errorBtn.onclick = (e) => { e.preventDefault(); location.reload(); };
  }
}

function showCardImmediate(htmlUrl) {
  loadingScreen.classList.add('hidden');
  cardSection.classList.add('active');
  cardIframe.src = htmlUrl;
}

async function loadCard() {
  if (!cardId) {
    showError('Card nahi mili', 'Shayad link galat hai. Please check the link you received.', 'Go to WishCard.in', null);
    return;
  }

  try {
    const cardRef = doc(db, 'cards', cardId);
    const cardSnap = await getDoc(cardRef);

    if (!cardSnap.exists()) {
      showError('Card nahi mili', 'Shayad link galat hai. Please check the link you received.', 'Go to WishCard.in', null);
      return;
    }

    const cardData = cardSnap.data();

    // Increment openCount for analytics
    try {
      await updateDoc(cardRef, { openCount: increment(1) });
    } catch (e) {
      // Analytics increment failure should not block card viewing
      console.warn('Could not update openCount:', e);
    }

    const { htmlUrl } = cardData;

    if (!htmlUrl) {
      showError('Oops!', 'Card content not available. Please try again later.', 'Go to WishCard.in', null);
      return;
    }

    // Show card directly in iframe
    showCardImmediate(htmlUrl);

  } catch (error) {
    console.error('Error loading card:', error);
    showError('Kuch gadbad hai', 'Please retry karo. Check your internet connection.', 'Retry', 'retry');
  }
}

loadCard();
</script>
</body>
</html>
