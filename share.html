function showError(title, message, btnText, btnAction) {
  loadingScreen.classList.add('hidden');
  errorSection.classList.add('active');
  errorTitle.textContent = title;
  errorMessage.textContent = message;
  if (btnText) errorBtn.textContent = btnText;
  if (btnAction === 'retry') {
    errorBtn.href = '#';
    errorBtn.onclick = (e) => { e.preventDefault(); location.reload(); };
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escJS(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r');
}

function sanitizeCSS(val) {
  if (val === null || val === undefined) return '';
  val = String(val);
  // Remove any characters that could break out of CSS into HTML
  val = val.replace(/[<>]/g, '');
  // Remove any style/script closing tag patterns
  val = val.replace(/<\//gi, '');
  // Remove expression() which is IE-specific XSS vector
  val = val.replace(/expression\s*\(/gi, '');
  // Remove @import
  val = val.replace(/@import/gi, '');
  return val;
}

function sanitizeTheme(t) {
  if (!t || typeof t !== 'object') return {};
  const clean = {};
  for (const k of Object.keys(t)) {
    if (Array.isArray(t[k])) {
      clean[k] = t[k].map(v => sanitizeCSS(v));
    } else {
      clean[k] = sanitizeCSS(t[k]);
    }
  }
  return clean;
}

function sanitizeBorder(b) {
  if (!b || typeof b !== 'object') return {};
  const clean = {};
  for (const k of Object.keys(b)) {
    clean[k] = sanitizeCSS(b[k]);
  }
  return clean;
}

function sanitizeFont(f) {
  if (!f || typeof f !== 'object') return {};
  const clean = {};
  for (const k of Object.keys(f)) {
    clean[k] = sanitizeCSS(f[k]);
  }
  return clean;
}

function ordinal(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

async function loadCard() {
  if (!cardId) {
    showError('Card nahi mili', 'Shayad link galat hai. Please check the link you received.', 'Go to WishCard.in', null);
    return;
  }
  let timedOut = false;
  const timeout = setTimeout(() => {
    timedOut = true;
    showError('Loading mein time lag raha hai', 'Internet slow hai ya card load nahi ho raha. Please retry karo.', 'Retry', 'retry');
  }, 15000);
  try {
    const cardRef = doc(db, 'cards', cardId);
    const cardSnap = await getDoc(cardRef);
    if (timedOut) return;
    if (!cardSnap.exists()) {
      clearTimeout(timeout);
      showError('Card nahi mili', 'Shayad link galat hai. Please check the link you received.', 'Go to WishCard.in', null);
      return;
    }
    const cardData = cardSnap.data();
    try { await updateDoc(cardRef, { openCount: increment(1) }); } catch (e) { console.warn('Could not update openCount:', e); }
    if (timedOut) return;
    const { cardType } = cardData;
    if (!cardType) {
      clearTimeout(timeout);
      showError('Oops!', 'Card content not available. Please try again later.', 'Go to WishCard.in', null);
      return;
    }
    let html = '';
    switch (cardType) {
      case 'birthday': html = buildBirthdayCard(cardData); break;
      case 'birthday-fullphoto': html = buildBirthdayFullphotoCard(cardData); break;
      case 'congrats': html = buildCongratsCard(cardData); break;
      case 'anniversary': html = buildAnniversaryCard(cardData); break;
      case 'baby': html = buildBabyCard(cardData); break;
      default:
        clearTimeout(timeout);
        showError('Oops!', 'Unknown card type. Please try again later.', 'Go to WishCard.in', null);
        return;
    }
    clearTimeout(timeout);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    clearTimeout(timeout);
    if (timedOut) return;
    console.error('Error loading card:', error);
    showError('Kuch gadbad hai', 'Please retry karo. Check your internet connection.', 'Retry', 'retry');
  }
}

loadCard();
